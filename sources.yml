# Where streams come from. Every stream, whatever its source, must pass POLICY.md
# (official domain or allowlisted host, not blocklisted, plays) before it is listed.
#
# kind: curated    a maintained public list, merged on every build
#       discovered streams that scripts/discover.py found on an official channel domain
# Changes to this file go through a pull request.
sources:
  - id: iptv-org
    name: iptv-org/iptv
    kind: curated
    homepage: https://github.com/iptv-org/iptv
    license: Unlicense (public domain)
    # cloned by the workflow; parsed from its streams/ directory

  - id: free-tv
    name: Free-TV/IPTV
    kind: curated
    homepage: https://github.com/Free-TV/IPTV
    url: https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8
    license: not stated; only links are used, attributed here

  - id: sea-curated
    name: Hand-picked Southeast Asian streams
    kind: curated
    path: sources/sea-curated.m3u
    # reviewed from discovered/REPORT.md: only CDN accounts that serve one broadcaster's own channels

  - id: discovered
    name: Streams found by scripts/discover.py
    kind: discovered
    path: discovered/official.m3u

# What scripts/discover.py searches for first, and highlights in discovered/REPORT.md.
# countries: ISO 3166-1 codes; categories: iptv-org category ids.
discovery:
  focus:
    # Southeast / East Asia (home markets) first, then major free-to-air markets worldwide.
    countries: [kr, jp, bn, kh, id, la, my, mm, ph, sg, th, tl, vn, cn, tw, hk,
                us, ca, mx, br, ar, cl, co,
                gb, ie, fr, de, es, it, pt, nl, se, pl, tr, ua, ru, gr, ro,
                sa, ae, eg, il, ir,
                in, pk, bd, lk,
                za, ng, ke,
                au, nz]
    categories: [sports]
